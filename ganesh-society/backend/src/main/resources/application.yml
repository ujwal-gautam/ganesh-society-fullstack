server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ganesh_society}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  bootstrap-enabled: ${BOOTSTRAP_ENABLED:false}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}

  cors-origin: ${CORS_ORIGIN:http://localhost:5173}

  jwt-secret: ${JWT_SECRET}
  jwt-issuer: ${JWT_ISSUER:ganesh-society}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

logging:
  level:
    org.springframework.security: DEBUG
