
name: Ganesh Society Backend CI/CD

on:
  push:
    branches: [feature/Dev]
    paths:
      - "ganesh-society/backend/**"
      - "ganesh-society/deploy/**"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches: [feature/Dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ganesh-backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ganesh-society/backend/pom.xml

      - name: Run backend tests
        working-directory: ganesh-society/backend
        run: mvn -B clean verify

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ganesh-society/backend
          file: ./ganesh-society/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ganesh-society-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ganesh-society-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd /opt/ganesh-society

            set -a
            . ./.env
            set +a

            export IMAGE_TAG

            docker compose -f docker-compose.prod.yml pull backend

            docker compose -f docker-compose.prod.yml \
              up -d --no-deps backend

            for i in $(seq 1 30); do
              if curl -fsS \
                http://127.0.0.1:8080/api/public/snapshot \
                >/dev/null; then
                echo "Deployment successful"
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
                exit 0
              fi
              sleep 5
            done

            docker compose -f docker-compose.prod.yml \
              logs --tail=100 backend
            exit 1
